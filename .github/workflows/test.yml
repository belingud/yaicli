name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install project
        run: uv sync --all-groups --all-extras

      # `[tool.ruff] fix = true` would silently repair violations and still exit 0,
      # so CI must pin --no-fix to make the lint job meaningful.
      - name: Ruff check
        run: uv run ruff check --no-fix yaicli tests

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install project
        run: uv sync --all-groups --all-extras

      - name: Run test suite
        run: uv run pytest -q
